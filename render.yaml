services:
  - type: web
    name: fbt-twin-api
    runtime: node
    rootDir: project-v1
    plan: free
    buildCommand: ""
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://fanfanbtoa.github.io
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
